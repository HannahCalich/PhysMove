# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples

on:
  push:
    branches: [main, master]
  pull_request:

name: R CMD check (multi-version)

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: '4.4'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest,  r: '4.4'}
          - {os: macos-latest,  r: 'release'}
          - {os: macos-latest,  r: 'devel'}
          - {os: windows-latest, r: '4.4'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gettext udunits pkg-config cairo freetype libpng fontconfig

          # Ensure gettext (libintl) is properly linked
          brew unlink gettext || true
          brew link gettext --force

          # Environment variables for compilation
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/gettext/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/gettext/lib -L/opt/homebrew/opt/libpng/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/gettext/include -I/opt/homebrew/opt/libpng/include -I/opt/homebrew/opt/libpng/include/libpng16" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/opt/gettext/lib:/opt/homebrew/opt/libpng/lib" >> $GITHUB_ENV

      - name: Configure R compilation flags (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.R
          cat <<EOF >> ~/.R/Makevars
          CPPFLAGS += -I/opt/homebrew/opt/gettext/include -I/opt/homebrew/opt/libpng/include -I/opt/homebrew/opt/libpng/include/libpng16
          LDFLAGS += -L/opt/homebrew/opt/gettext/lib -L/opt/homebrew/opt/libpng/lib
          EOF

      - name: Install infomapecology from drat
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("drat")
          drat::addRepo("HannahCalich")
          install.packages("infomapecology")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, infomapecology=?ignore-before-r=99.0.0
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
